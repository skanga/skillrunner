name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.5'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv build
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - name: Test contracts, lifecycle, and offline wheel installation
        run: uv run --locked pytest
      - name: Smoke test installed command
        run: uv run --locked skillrun run --help
      - name: Qualify isolated source and wheel installations
        run: uv run --locked python scripts/qualification_install_probe.py
