# Copy to ./skillrun.toml and edit the model profile before running a task.
schema_version = 1
skills_dir = "./skills"
output_dir = "./outputs"
default_model = "local"

[models.local]
base_url = "http://localhost:8000/v1"
model = "replace-with-your-model-id"
auth_mode = "none"
# These are examples, not claims about your model. Use its documented capacities.
context_window_tokens = 32768
max_output_tokens = 4096
output_token_parameter = "max_tokens"
# When neither configuration nor endpoint metadata supplies modalities, the
# runner defaults to text. PNG reads require the explicit accounting contract
# and validator below; endpoint modality support alone does not enable reads.
# input_modalities = ["text"]
# PNG inspection also requires an allowlisted artifacts.validators.png parser:
# input_modalities = ["text", "image"]
# image_accounting = "openai-patch-high-v1"
# For a standard Gemma 4 single-image processor (maximum 1120 visual tokens):
# image_accounting = "gemma4-image-max-v1"
# For authentication: auth_mode = "bearer" and api_key_env = "MODEL_API_KEY".
# Store the credential in that environment variable, never in this file.
# Optional endpoint-specific inference options; use only supported keys.
# [models.local.request_options]
# reasoning_effort = "low"

# Optional metadata mapping; paths are relative to base_url, keys are dotted paths.
# [models.local.discovery]
# path = "models/replace-with-your-model-id"
# context_window_field = "limits.context"
# max_output_field = "limits.output"

# Used only with --base-url / OPENAI_BASE_URL and a literal --model identifier.
# These settings are independent of named profiles.
[direct_model]
auth_mode = "none"
context_window_tokens = 32768
max_output_tokens = 4096
# api_key_env = "DIRECT_MODEL_API_KEY"
# output_token_parameter = "max_completion_tokens"
# input_modalities = ["text"]
# PNG inspection also requires an allowlisted artifacts.validators.png parser:
# input_modalities = ["text", "image"]
# image_accounting = "openai-patch-high-v1"
# For a standard Gemma 4 single-image processor (maximum 1120 visual tokens):
# image_accounting = "gemma4-image-max-v1"
# [direct_model.request_options]
# temperature = 0.2
# [direct_model.discovery]
# path = "models/replace-with-your-model-id"
# context_window_field = "limits.context"
# max_output_field = "limits.output"

[limits]
timeout = "10m"
shutdown_grace = "5s"
max_steps = 40
max_tool_calls = 100
max_tokens = 100000
# Retry transient model transport failures once; set to 0 to disable.
model_transport_retries = 1

[storage]
# Integer byte/file counts; these are the built-in defaults.
max_input_files = 10_000
max_input_bytes = 1_073_741_824
max_package_files = 20_000
max_package_bytes = 536_870_912
max_artifact_bytes = 2_147_483_648
max_scratch_bytes = 4_294_967_296
max_tool_output_bytes = 1_048_576
max_event_log_bytes = 10_485_760
max_read_bytes = 65_536
max_archive_expanded_bytes = 268_435_456

[policy]
# Empty permits no commands. Add only installed executables your skills need.
# Examples: ["python3", "node"] or absolute executable paths.
allowed_executables = []
# allowed_env = ["SERVICE_TOKEN"]

# Explicit child environment references, keyed by the configured executable.
# [policy.command_env.python3]
# SERVICE_TOKEN = "MY_SERVICE_TOKEN"

[diagnostics]
log_content = false
retain_work = false
redact_env = []

# Formats outside the built-in text/JSON/CSV/ZIP/DOCX/XLSX checks need an
# installed, allowlisted validator that parses the actual file. Exactly one
# validator argument must contain {path}.
# [artifacts.validators.pdf]
# command = "/absolute/path/to/pdf-validator"
# args = ["--check", "{path}"]

# Model Context Protocol (MCP) examples: enable only tools you intend to expose.
# [mcp.documents]
# transport = "streamable-http"
# url = "https://your-service.example/mcp"
# allowed_tools = ["search_documents"]
# [mcp.documents.headers]
# Authorization = "DOCUMENTS_AUTH_HEADER"
# The referenced variable holds the complete header value, e.g. Bearer <token>.

# A stdio server's executable must also appear in policy.allowed_executables.
# [mcp.local]
# transport = "stdio"
# command = "python3"
# args = ["/absolute/path/to/server.py"]
# allowed_tools = ["lookup"]
# [mcp.local.env]
# SERVICE_TOKEN = "MY_SERVICE_TOKEN"

# PNG image reads use the same configured parser as PNG artifact validation.
# Enable the image modality and explicit accounting contract in the model profile.
# [artifacts.validators.png]
# command = "/absolute/path/to/png-validator"
# args = ["{path}"]
